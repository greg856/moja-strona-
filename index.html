<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Innovate Stadia Systems Poland – Stadiony i areny w technologii modułowej</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#050b16;--soft:#08111f;--ink:#eaf6ff;--mut:#8fa8c2;--ac:#25b7ff;--ac2:#6fd3ff;--line:rgba(80,190,255,.18);--card:#0a1628;--glass:rgba(5,11,22,.72);--nv:#040a14;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.65 Inter,system-ui,sans-serif;overflow-x:hidden}
html.lenis{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}
a{color:inherit;text-decoration:none}
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(8px + env(safe-area-inset-top,0px)) 5vw 8px;background:var(--glass);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.logo{display:block;line-height:0}.logo img{height:62px;width:auto;display:block}.flogo{height:110px;width:auto;display:block}
.links{display:flex;gap:26px;font-size:.9rem;font-weight:500}
.links a{color:var(--mut);padding:4px 0;border-bottom:2px solid transparent;transition:color .25s,border-color .25s}.links a:hover{color:var(--ink)}.links a.on{color:var(--ink);border-color:var(--ac)}
.tools{display:flex;gap:10px;align-items:center}
.lang{border:1px solid var(--line);background:none;color:var(--ink);padding:7px 13px;border-radius:10px;font:600 .75rem Inter;cursor:pointer}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 11px;font-size:1rem;cursor:pointer}
@media(max-width:900px){.burger{display:block}.links{position:fixed;top:0;left:0;right:0;flex-direction:column;background:var(--bg);padding:calc(80px + env(safe-area-inset-top,0px)) 5vw 28px;transform:translateY(-110%);transition:transform .45s;z-index:-1;gap:16px;font-size:1.05rem;border-bottom:1px solid var(--line)}.links.open{transform:none}}
.sec{padding:110px 5vw}.soft{background:var(--soft)}
.dk{background:radial-gradient(60% 90% at 85% 0,rgba(37,183,255,.2),transparent 70%),var(--nv);color:#fff;border-top:1px solid var(--line)}.dk .lead{color:#b4c8e0}
.eyebrow{display:flex;align-items:center;gap:12px;font:600 .74rem Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin-bottom:20px}.eyebrow::before{content:'';width:28px;height:2px;background:currentColor}
.dk .eyebrow{color:var(--ac2)}
h1,h2,h3{font-family:Sora,Inter,sans-serif;font-weight:600;letter-spacing:-.035em;line-height:1.08}
h1{font-size:clamp(2.3rem,5.6vw,4.9rem);max-width:17ch}
h2{font-size:clamp(1.8rem,3.8vw,3rem);margin-bottom:18px;max-width:22ch}
h3{font-size:1.2rem;letter-spacing:-.02em;margin-bottom:8px}
.lead{color:var(--mut);font-size:1.08rem;max-width:62ch}
.hero{position:relative;min-height:100svh;display:flex;align-items:center;padding:140px 5vw 90px;background:var(--bg);overflow:hidden}
.hbg{position:absolute;inset:-10% 0;background-size:cover;background-position:72% center;background-repeat:no-repeat}
.hbg::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,11,22,.95) 0,rgba(5,11,22,.72) 42%,rgba(5,11,22,.08) 100%),linear-gradient(180deg,transparent 72%,var(--bg))}
@media(max-width:900px){.hbg{background-position:70% center}.hbg::after{background:linear-gradient(180deg,rgba(5,11,22,.78),rgba(5,11,22,.92))}}
.gl{background:linear-gradient(100deg,#25b7ff,#9be8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hin{position:relative;max-width:760px}.hin .lead{margin-top:24px;color:#bcd0e6}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.btn{display:inline-block;padding:14px 26px;border-radius:12px;font:600 .9rem Inter;border:1px solid var(--ink);cursor:pointer;background:none;color:inherit;transition:transform .25s,background .25s,color .25s}
.btn:hover{transform:translateY(-2px)}.btn.p{background:var(--ac);border-color:var(--ac);color:#03101f;box-shadow:0 0 34px -6px rgba(37,183,255,.65)}.btn.p:hover{background:var(--ac2);border-color:var(--ac2)}
.dk .btn{border-color:rgba(255,255,255,.45)}.dk .btn.p{border-color:var(--ac)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--nv);color:#fff;border-block:1px solid var(--line)}
.stat{padding:34px 5vw;border-right:1px solid var(--line)}.stat b{display:block;font:600 clamp(1.9rem,3.6vw,2.8rem) Sora,sans-serif;letter-spacing:-.03em;color:var(--ac2);text-shadow:0 0 28px rgba(37,183,255,.55)}.stat span{font-size:.8rem;color:#9fb6cf;letter-spacing:.08em;text-transform:uppercase}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:44px}
.tl{padding:30px 28px;border:1px solid var(--line);border-radius:20px;background:var(--card);transition:transform .35s,border-color .35s,box-shadow .35s}
.tl:hover{transform:translateY(-4px);border-color:var(--ac);box-shadow:0 0 50px -14px rgba(37,183,255,.45)}
.tl small{font:600 .72rem Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}.tl p{color:var(--mut);font-size:.95rem;margin-top:6px}.tl a.m{display:inline-block;margin-top:16px;font-weight:600;font-size:.88rem;color:var(--ac)}
.tl .big{font:600 2.4rem/1.1 Sora,sans-serif;letter-spacing:-.04em;margin:8px 0 4px}
.n{font:600 3rem/1 Sora,sans-serif;color:var(--ac);letter-spacing:-.04em;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6vw;align-items:center}@media(max-width:900px){.two{grid-template-columns:1fr}}
.fig{border-radius:20px;overflow:hidden;aspect-ratio:4/3;background:var(--soft);position:relative}.fig img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s}.fig:hover img{transform:scale(1.04)}
.cap{margin-top:12px;font:600 .95rem Sora,sans-serif;letter-spacing:-.02em}.cap small{display:block;font:400 .82rem Inter;color:var(--mut);letter-spacing:0;margin-top:2px}
.pm{overflow:hidden;margin-top:40px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.pm .tr{display:flex;gap:18px;width:max-content;animation:m 38s linear infinite}.pm:hover .tr{animation-play-state:paused}

.lg{display:flex;align-items:center;justify-content:center;height:112px;padding:0 44px;border:1px solid var(--line);border-radius:16px;background:var(--card);flex:none}.lg img{display:block;width:auto;opacity:.92}
.plg{display:flex;align-items:center;height:84px;margin-bottom:14px}.plg img{width:auto;max-width:100%;display:block}
.by{display:block;color:var(--ac2);font-weight:500;margin-top:3px}
.mk{width:26px;height:26px;border-radius:7px;background:var(--ac);box-shadow:0 0 16px rgba(37,183,255,.7)}.lg:nth-child(4n+2) .mk{border-radius:50%}.lg:nth-child(4n+3) .mk{transform:rotate(45deg) scale(.82)}.lg:nth-child(4n) .mk{border-radius:50% 0}
@keyframes m{to{transform:translateX(calc(-50% - 9px))}}
.ph{padding:160px 5vw 40px;background:radial-gradient(50% 120% at 85% 0,rgba(37,183,255,.16),transparent 70%),var(--soft);border-bottom:1px solid var(--line)}
form{display:grid;gap:14px;max-width:620px;margin-top:10px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--ink);font:400 .95rem Inter;outline:none;transition:border-color .25s}input:focus,textarea:focus{border-color:var(--ac)}textarea{min-height:140px;resize:vertical}
footer{background:var(--nv);color:#9fb6cf;border-top:1px solid var(--line);padding:60px 5vw 36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:34px;font-size:.9rem}
footer h4{color:#fff;font:600 .74rem Inter;letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px}footer a{display:block;margin:5px 0}footer a:hover{color:#fff}
.copy{grid-column:1/-1;border-top:1px solid var(--line);padding-top:22px;font-size:.78rem}
.ga [data-r]{opacity:0}
@media(prefers-reduced-motion:reduce){.pm .tr{animation:none}}
</style>
</head>
<body>
<nav><a class="logo" href="#home" aria-label="Innovate Stadia Systems Poland"><img id="lg" alt="Innovate Stadia Systems Poland"></a><div class="links" id="links"></div><div class="tools"><button class="lang" id="lang"></button><button class="burger" id="bg" aria-label="Menu">☰</button></div></nav>
<main id="app"></main>
<footer id="foot"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
if(window.gsap&&window.ScrollTrigger)document.documentElement.classList.add('ga');
const IMG={"sketch": "assets/sketch.jpg", "holo": "assets/holo.jpg", "hero": "assets/hero.jpg", "dome": "assets/dome.jpg", "arena": "assets/arena.jpg", "render": "assets/render.jpg", "stand": "assets/stand.jpg", "logo": "assets/logo.png", "l_gb": "assets/l_gb.png", "l_tilea": "assets/l_tilea.png", "l_awl": "assets/l_awl.png", "l_is": "assets/l_is.png", "p_night": "assets/p_night.jpg", "p_stand2": "assets/p_stand2.jpg", "p_kiosk": "assets/p_kiosk.jpg", "p_padel": "assets/p_padel.jpg", "p_ice": "assets/p_ice.jpg", "p_pool": "assets/p_pool.jpg"};
document.getElementById('lg').src=IMG.logo;
let L='pl';try{L=localStorage.getItem('l')||((navigator.language||'pl').slice(0,2)==='pl'?'pl':'en')}catch(e){}
if(L!=='pl'&&L!=='en')L='pl';
const t=(p,e)=>L==='pl'?p:e;
const NAV=[['home','Strona główna','Home'],['o-firmie','O firmie','About'],['inzynieria','Inżynieria','Engineering'],['projekty','Projekty','Projects'],['partnerzy','Partnerzy','Partners'],['kontakt','Wyślij zapytanie','Enquiry']];
const LG=[['Innovate Stadia (UK)','l_is',46,'https://innovatestadia.com'],['Tilea Systems','l_tilea',34,'https://tilea.systems'],['AWL','l_awl',64,'https://awl.ie'],['GB Consultancy Group','l_gb',66,'']];
const logos=()=>`<div class="pm" data-r><div class="tr">${[0,1,2,3].map(()=>LG.map(([n,k,h])=>`<div class="lg"><img src="${IMG[k]}" alt="${n}" style="height:${h}px"></div>`).join('')).join('')}</div></div>`;
const cta=()=>`<section class="sec dk"><span class="eyebrow" data-r>${t('Co dalej?','What’s next?')}</span><h2 data-r>${t('Opisz nam swój obiekt — wrócimy z propozycją.','Tell us about your venue — we’ll come back with a proposal.')}</h2><p class="lead" data-r>${t('Zapraszamy inwestorów, architektów i przedstawicieli samorządów. Nasz zespół w Warszawie odpowiada na zapytania dotyczące technologii modułowej oraz przeliczeń konstrukcyjnych.','Investors, architects and municipalities are welcome. Our Warsaw team answers enquiries on modular technology and structural calculations.')}</p><div class="btns" data-r><a class="btn p" href="#kontakt">${t('Wyślij zapytanie','Send an enquiry')}</a></div></section>`;
const hd=(e,h,l)=>`<section class="ph"><span class="eyebrow" data-r>${e}</span><h1 data-r style="font-size:clamp(2.1rem,4.8vw,4rem)">${h}</h1><p class="lead" data-r style="margin-top:20px">${l}</p></section>`;
const fig=(k,h,s)=>`<div data-r><div class="fig"><img src="${IMG[k]}" alt="${h}" loading="lazy"></div><div class="cap">${h}<small>${s}</small></div></div>`;
const BY=()=>t('Realizacja partnera sieci Innovate Stadia','Delivered by a partner in the Innovate Stadia network');
const PO=()=>[['hero','Sportowa Arena Warszawa',t('Wizualizacja hali pneumatycznej','Air-supported dome visualisation')],['render',t('Koncepcja stadionu','Stadium concept'),t('Wizualizacja w modelu 3D/BIM','Visualisation from a 3D/BIM model')],['sketch',t('Plan stadionu','Stadium plan'),t('Rzut z góry, boisko 105 × 68 m','Plan view, 105 × 68 m pitch')]];
const PP=()=>[['p_padel',t('Hala pneumatyczna nad kortami padel','Air-supported dome over padel courts'),'Klaipėdos Padelio Arena'],['p_night',t('Stadion z zadaszonymi trybunami — widok nocny','Stadium with covered stands — night view'),t('Widok nocny obiektu','Night view of the venue')],['p_stand2',t('Trybuna z zadaszeniem i zapleczem handlowym','Covered stand with retail units'),t('Zadaszona trybuna z pawilonami usługowymi','Covered stand with service pavilions')],['p_ice',t('Lodowisko pod halą pneumatyczną','Ice rink under an air-supported dome'),t('Hala z siatkami ochronnymi i oświetleniem','Dome with protective netting and lighting')],['p_pool',t('Basen pod halą pneumatyczną','Swimming pool under an air-supported dome'),t('Całoroczny basen w hali','Year-round pool in a dome')],['arena',t('Stadion z zadaszonymi trybunami','Stadium with covered stands'),t('Modułowe, zadaszone trybuny','Modular covered stands')],['dome',t('Hala pneumatyczna','Air-supported dome'),t('Całoroczna hala nad boiskiem','Year-round dome over the pitch')],['stand',t('Trybuna modułowa','Modular stand'),t('Prefabrykacja, zadaszenie, przeszklenie','Prefabrication, canopy, glazing')],['p_kiosk',t('Pawilon modułowy','Modular pavilion'),t('Wizualizacja modułowego pawilonu usługowego','Visualisation of a modular service pavilion')]].map(([k,h,d])=>[k,h,d+'<b class="by">'+BY()+'</b>']);
const P={
home:()=>`<section class="hero"><div class="hbg" style="background-image:url(${IMG.holo})"></div><div class="hin">
<span class="eyebrow" data-r>${t('Wyłączny przedstawiciel Innovate Stadia Ltd. w Polsce','Exclusive representative of Innovate Stadia Ltd. in Poland')}</span>
<h1 data-r>${t('Stadiony i areny w technologii <span class="gl">modułowej.</span>','Stadiums and arenas in <span class="gl">modular</span> technology.')}</h1>
<p class="lead" data-r>${t('Nadzorujemy cały proces — od szkicu konstrukcyjnego po ostatni panel elewacyjny. Dostarczamy trybuny, stadiony i hale klasy UEFA/FIFA w technologii kompozytowej: szybciej, lżej i z mniejszym śladem węglowym.','We oversee the whole process — from the first structural sketch to the last façade panel. We deliver UEFA/FIFA-class stands, stadiums and halls in composite technology: faster, lighter and with a smaller carbon footprint.')}</p>
<div class="btns" data-r><a class="btn p" href="#kontakt">${t('Wyślij zapytanie','Send an enquiry')}</a><a class="btn" href="#projekty">${t('Zobacz projekty','View projects')}</a><a class="btn" data-go="proc" href="#home">${t('Jak pracujemy','How we work')}</a></div></div></section>
<div class="strip"><div class="stat"><b>−<i data-n="50">0</i>%</b><span>${t('Czas realizacji','Delivery time')}</span></div><div class="stat"><b>−<i data-n="40">0</i>%</b><span>${t('Ślad węglowy','Carbon footprint')}</span></div><div class="stat"><b>−<i data-n="70">0</i>%</b><span>${t('Masa vs. beton','Weight vs. concrete')}</span></div><div class="stat"><b>UEFA/FIFA</b><span>${t('Standard wykonania','Build standard')}</span></div></div>
<section class="sec"><span class="eyebrow" data-r>${t('Czym się zajmujemy','What we do')}</span><h2 data-r>${t('Trzy obszary, jeden partner od szkicu do montażu.','Three areas, one partner from sketch to assembly.')}</h2>
<div class="g3"><div class="tl" data-r><small>01</small><h3>${t('Nowe stadiony i trybuny','New stadiums and stands')}</h3><p>${t('Od pojedynczych trybun po całe stadiony i hale — projekt, prefabrykacja i montaż.','From single stands to entire stadiums and halls — design, prefabrication and assembly.')}</p><a class="m" href="#projekty">${t('Projekty →','Projects →')}</a></div>
<div class="tl" data-r><small>02</small><h3>${t('Systemy modułowe i kompozytowe','Modular and composite systems')}</h3><p>${t('Kompozytowa Technologia zamiast betonu: o 70–80% lżejsza, odporna na korozję, ogień (do 120 min) i obciążenia wybuchowe SDOF.','Composite technology instead of concrete: 70–80% lighter, resistant to corrosion, fire (up to 120 min) and SDOF blast loads.')}</p><a class="m" href="#inzynieria">${t('Inżynieria →','Engineering →')}</a></div>
<div class="tl" data-r><small>03</small><h3>${t('Modernizacje obiektów','Venue upgrades')}</h3><p>${t('Rozbudowa istniejących obiektów, bez rozbiórki, z pełnym modelem 3D/BIM.','Extending existing venues without demolition, with a full 3D/BIM model.')}</p><a class="m" href="#kontakt">${t('Zapytaj →','Ask →')}</a></div></div></section>
<section class="sec soft" id="proc"><span class="eyebrow" data-r>${t('Jak pracujemy','How we work')}</span><h2 data-r>${t('Cztery kroki od zapytania do gotowego obiektu.','Four steps from enquiry to finished venue.')}</h2>
<div class="g3" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">${[[t('Zapytanie','Enquiry'),t('Opisujesz obiekt i potrzeby. Odpowiadamy z propozycją.','You describe the venue and needs. We reply with a proposal.')],[t('Koncepcja 3D/BIM','3D/BIM concept'),t('Pełne modelowanie i przeliczenia konstrukcyjne.','Full modelling and structural calculations.')],[t('Prefabrykacja','Prefabrication'),t('Produkcja off-site — krótszy czas na budowie.','Off-site production — less time on site.')],[t('Montaż','Assembly'),t('Szybki montaż i oddanie obiektu.','Fast assembly and handover.')]].map(([h,p],i)=>`<div class="tl" data-r><div class="n">0${i+1}</div><h3>${h}</h3><p>${p}</p></div>`).join('')}</div></section>
<section class="sec"><span class="eyebrow" data-r>${t('Dla kogo','Who we work with')}</span><h2 data-r>${t('Inwestorzy, architekci i samorządy.','Investors, architects and municipalities.')}</h2>
<div class="g3">${[[t('Inwestorzy','Investors'),t('Krótszy czas realizacji dzięki prefabrykacji off-site.','Shorter delivery thanks to off-site prefabrication.')],[t('Architekci','Architects'),t('Modelowanie 3D/BIM i przeliczenia konstrukcyjne SPS.','3D/BIM modelling and SPS structural calculations.')],[t('Samorządy','Municipalities'),t('Trybuny i hale klasy UEFA/FIFA z mniejszym śladem węglowym.','UEFA/FIFA-class stands and halls with a smaller carbon footprint.')]].map(([h,p])=>`<div class="tl" data-r><h3>${h}</h3><p>${p}</p></div>`).join('')}</div></section>
<section class="sec soft"><span class="eyebrow" data-r>${t('Realizacje partnerów','Partner projects')}</span><h2 data-r>${t('Obiekty zrealizowane przez naszych partnerów.','Venues delivered by our partners.')}</h2><div class="g3">${PP().filter(x=>['p_padel','p_night','p_stand2'].includes(x[0])).map(([k,h,s])=>fig(k,h,s)).join('')}</div><div class="btns" data-r><a class="btn" href="#projekty">${t('Wszystkie projekty','All projects')}</a></div></section>
<section class="sec"><span class="eyebrow" data-r>${t('Partnerzy','Partners')}</span><h2 data-r>${t('Globalna sieć, lokalne wykonanie.','A global network, local delivery.')}</h2>${logos()}</section>${cta()}`,
'o-firmie':()=>hd(t('O firmie','About us'),t('Most technologiczny między Wielką Brytanią a Europą Środkową.','A technology bridge between the UK and Central Europe.'),t('Innovate Stadia Systems Poland łączy brytyjskie know-how techniczne z dogłębną znajomością środkowoeuropejskiego rynku.','Innovate Stadia Systems Poland combines British technical know-how with deep knowledge of the Central European market.'))+`<section class="sec"><div class="two"><div><span class="eyebrow" data-r>${t('Pozycja','Position')}</span><h2 data-r>${t('Wyłączny przedstawiciel Innovate Stadia Ltd. w Polsce.','Exclusive representative of Innovate Stadia Ltd. in Poland.')}</h2><p class="lead" data-r>${t('Dyrektorzy spółki dostrzegli lukę między dostępnością przełomowych technologii kompozytowych a ich praktycznym wdrożeniem na lokalnych rynkach — i zbudowali firmę, która tę lukę wypełnia. SPS to technologia, której używamy.','The company’s Directors saw a gap between the availability of breakthrough composite technology and its practical rollout in local markets — and built a company that closes it. SPS is the technology we use.')}</p><p class="lead" data-r style="margin-top:14px;font-size:.9rem">${t('Źródło: „Synergy Transforming European Arenas”, 2026.','Source: “Synergy Transforming European Arenas”, 2026.')}</p></div>${fig('arena',t('Stadion z zadaszonymi trybunami','Stadium with covered stands'),'')}</div></section>`+cta(),
inzynieria:()=>hd(t('Inżynieria','Engineering'),t('Kompozyty zamiast betonu.','Composites instead of concrete.'),t('Prefabrykacja off-site, pełne modelowanie 3D/BIM i przeliczenia konstrukcyjne — szybciej i lżej. Nowoczesna Kompozytowa Technologia, której używamy.','Off-site prefabrication, full 3D/BIM modelling and structural calculations — faster and lighter. Modern Composite the technology we use.'))+`<section class="sec"><div class="g3" style="margin-top:0">${[['70–80%',t('lżejszy niż beton','lighter than concrete')],['120 min',t('odporność ogniowa','fire resistance')],['SDOF',t('obciążenia wybuchowe','blast loading')],[t('Korozja','Corrosion'),t('materiał odporny na korozję','corrosion-resistant material')]].map(([a,b])=>`<div class="tl" data-r><div class="big">${a}</div><p>${b}</p></div>`).join('')}</div></section>`+cta(),
projekty:()=>hd(t('Projekty','Projects'),t('Propozycje i realizacje.','Proposals and delivered venues.'),t('Nasze propozycje oraz obiekty zrealizowane przez partnerów sieci Innovate Stadia.','Our proposals and venues delivered by partners in the Innovate Stadia network.'))+`<section class="sec"><span class="eyebrow" data-r>${t('Proponowane projekty','Proposed projects')}</span><h2 data-r>${t('Nasze propozycje.','Our proposals.')}</h2><div class="g3">${PO().map(([k,h,s])=>fig(k,h,s)).join('')}</div></section><section class="sec soft"><span class="eyebrow" data-r>${t('Realizacje partnerów','Partner projects')}</span><h2 data-r>${t('Obiekty zrealizowane przez naszych partnerów.','Venues delivered by our partners.')}</h2><p class="lead" data-r>${t('Poniższe obiekty zrealizowali partnerzy sieci Innovate Stadia.','The venues below were delivered by partners in the Innovate Stadia network.')}</p><div class="g3">${PP().map(([k,h,s])=>fig(k,h,s)).join('')}</div></section>`+cta(),
partnerzy:()=>hd(t('Partnerzy','Partners'),t('Sieć partnerów globalnych.','A global partner network.'),t('Wspólne doświadczenie międzynarodowe w projektowaniu i budowie aren.','Shared international experience in designing and building arenas.'))+`<section class="sec">${logos()}<div class="g3">${LG.map(([n,k,h,u])=>`<div class="tl" data-r><div class="plg"><img src="${IMG[k]}" alt="${n}" style="height:${Math.round(h*1.15)}px"></div><h3>${n}</h3>${u?`<a class="m" href="${u}" target="_blank" rel="noopener">${u.replace('https://','')} ↗</a>`:''}</div>`).join('')}</div></section>`+cta(),
kontakt:()=>hd(t('Kontakt','Contact'),t('Wyślij zapytanie.','Send an enquiry.'),t('Aleja Jana Pawła II 27, 00-867 Warszawa','Aleja Jana Pawła II 27, 00-867 Warsaw'))+`<section class="sec"><form id="f" data-r action="https://formsubmit.co/gregborowiec23@gmail.com" method="POST"><input type="hidden" name="_subject" value="Zapytanie ze strony Innovate Stadia Systems Poland"><input type="hidden" name="_captcha" value="false"><input type="hidden" name="_template" value="table"><input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off"><input name="Imię i nazwisko / firma" required placeholder="${t('Imię i nazwisko / firma','Name / company')}"><input name="email" type="email" required placeholder="${t('Adres e-mail','E-mail address')}"><textarea name="Treść zapytania" required placeholder="${t('Treść zapytania','Your enquiry')}"></textarea><button class="btn p" type="submit">${t('Wyślij zapytanie','Send enquiry')}</button></form></section>`
};
let lenis,ctx;
function render(){
 const h=(location.hash||'#home').slice(1);const key=P[h]?h:'home';
 document.documentElement.lang=L;
 const lk=document.getElementById('links');
 lk.innerHTML=NAV.map(([k,a,b])=>`<a href="#${k}" class="${k===key?'on':''}">${t(a,b)}</a>`).join('');lk.classList.remove('open');
 document.getElementById('lang').textContent=L==='pl'?'EN':'PL';
 document.getElementById('app').innerHTML=P[key]();
 document.getElementById('foot').innerHTML=`<div><img class="flogo" src="${IMG.logo}" alt="Innovate Stadia Systems Poland"><p style="margin-top:10px">${t('Wyłączny przedstawiciel Innovate Stadia Ltd. w Polsce.','Exclusive representative of Innovate Stadia Ltd. in Poland.')}</p></div><div><h4>${t('Nawigacja','Navigation')}</h4>${NAV.slice(1,5).map(([k,a,b])=>`<a href="#${k}">${t(a,b)}</a>`).join('')}</div><div><h4>${t('Kontakt','Contact')}</h4><a href="#kontakt">Aleja Jana Pawła II 27<br>00-867 ${t('Warszawa','Warsaw')}</a><a href="#kontakt">${t('Formularz zapytania →','Enquiry form →')}</a></div><div><h4>${t('Grupa i Partnerzy','Group & Partners')}</h4><a href="https://innovatestadia.com" target="_blank" rel="noopener">Innovate Stadia (UK) ↗</a><a href="https://awl.ie/" target="_blank" rel="noopener">AWL ↗</a><a href="https://tilea.systems" target="_blank" rel="noopener">Tilea Systems ↗</a></div><div class="copy">© 2026 Innovate Stadia Systems Poland Sp. z o.o.</div>`;
 anim();
}
function anim(){
 if(!window.gsap||!window.ScrollTrigger)return;
 if(ctx)ctx.revert();ScrollTrigger.getAll().forEach(s=>s.kill());
 if(lenis)lenis.scrollTo(0,{immediate:true});else window.scrollTo(0,0);
 ctx=gsap.context(()=>{
  gsap.utils.toArray('[data-r]').forEach(el=>gsap.fromTo(el,{opacity:0,y:26},{opacity:1,y:0,duration:.8,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 94%'}}));
  document.querySelectorAll('[data-n]').forEach(el=>{const o={v:0},n=+el.dataset.n;ScrollTrigger.create({trigger:el,start:'top 98%',once:true,onEnter:()=>gsap.to(o,{v:n,duration:1.8,ease:'power2.out',onUpdate:()=>el.textContent=Math.round(o.v)})})});
  if(document.querySelector('.hbg'))gsap.to('.hbg',{yPercent:8,ease:'none',scrollTrigger:{trigger:'.hero',scrub:true,start:'top top',end:'bottom top'}});
 });
 ScrollTrigger.refresh();
}
document.getElementById('lang').onclick=()=>{L=L==='pl'?'en':'pl';try{localStorage.setItem('l',L)}catch(e){}render()};
document.getElementById('bg').onclick=()=>document.getElementById('links').classList.toggle('open');
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-go]');if(a){e.preventDefault();const el=document.getElementById(a.dataset.go);if(el){lenis?lenis.scrollTo(el,{offset:-70}):el.scrollIntoView({behavior:'smooth'})}}});
addEventListener('hashchange',render);
try{gsap.registerPlugin(ScrollTrigger)}catch(e){}
try{lenis=new Lenis({duration:1.1,smoothWheel:true});lenis.on('scroll',ScrollTrigger.update);gsap.ticker.add(tm=>lenis.raf(tm*1000));gsap.ticker.lagSmoothing(0)}catch(e){}
render();
</script>
</body>
</html>
